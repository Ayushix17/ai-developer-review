databases:
  - name: ai-developer-review-db
    plan: free

services:
  - type: web
    name: ai-developer-review-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-developer-review-db
          property: connectionString

  - type: web
    name: ai-developer-review-frontend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT"
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: ai-developer-review-backend
          type: web
          property: hostport
